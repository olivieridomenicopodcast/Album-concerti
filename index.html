<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14111d">
<title>Album Concerti</title>
<style>
:root{
  --bg:#14111d;--bg2:#1c1829;--card:#221d33;--line:#352e4d;--tx:#f3eefc;--mut:#9c93b8;
  --a:#ff3d8b;--b:#ffb800;--c:#35e0c6;--ok:#4ade80;--bad:#ff5d5d;--r:14px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#2a1d4a55,transparent),var(--bg);color:var(--tx);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
a{color:var(--c);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;
  background:#14111dee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:19px;letter-spacing:.5px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:6px}
nav{display:flex;gap:4px}
nav a{padding:7px 12px;border-radius:99px;color:var(--mut);font-weight:600}
nav a.on{background:var(--card);color:var(--tx)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:linear-gradient(135deg,var(--a),#c026d3);border-color:transparent;color:#fff}
.btn.dan{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:wait}
.dot{width:9px;height:9px;border-radius:50%;background:var(--b);display:none}
.dirty .dot{display:inline-block}
main{max-width:1200px;margin:0 auto;padding:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.toolbar input,.toolbar select,.f input,.f select,.f textarea{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.toolbar input[type=search]{flex:1 1 200px}
.toolbar select{max-width:170px}
.summary{color:var(--mut);margin:4px 0 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--bg2);border:0;padding:8px 12px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--tx)}

/* figurine */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{position:relative;border-radius:16px;padding:3px;background:linear-gradient(135deg,var(--b),var(--a),var(--c),var(--b));
  box-shadow:0 6px 18px #0007;transition:transform .15s}
.card:hover{transform:translateY(-3px) rotate(-.6deg)}
.card>.in{background:var(--card);border-radius:13px;overflow:hidden;height:100%;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:3/4;cursor:zoom-in;overflow:hidden;background:var(--g,#333);display:flex;align-items:center;justify-content:center}
.ph .ini{font-size:44px;font-weight:900;color:#fff9;text-shadow:0 2px 8px #0006}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.ph img.ok{opacity:1}
.num{position:absolute;top:6px;left:6px;background:#000a;border-radius:8px;padding:1px 7px;font-size:12px;font-weight:700}
.cnt{position:absolute;top:6px;right:6px;background:var(--b);color:#1b1300;border-radius:99px;padding:1px 9px;font-size:13px;font-weight:800}
.rib{position:absolute;left:-34px;bottom:14px;transform:rotate(-35deg);background:var(--a);color:#fff;font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 40px}
.card.future .ph img{filter:grayscale(.8) brightness(.8)}
.card.future>.in{opacity:.92}
.meta{padding:9px 10px 11px;display:flex;flex-direction:column;gap:2px}
.meta h3{font-size:16px;line-height:1.15}
.meta .s{color:var(--mut);font-size:12.5px}
.tag{display:inline-block;margin-top:5px;align-self:flex-start;background:#35e0c61f;color:var(--c);border:1px solid #35e0c655;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag:hover{background:#35e0c633}
.chip{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 11px;margin:2px 4px 2px 0;font-size:13px}
/* list view */
.grid.list{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.list .card>.in{flex-direction:row}
.list .ph{width:120px;flex:none;aspect-ratio:3/4}
.list .meta{justify-content:center;min-width:0}
.list .meta h3{font-size:18px}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.empty h2{color:var(--tx);margin-bottom:6px}

/* pagine */
.hero{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
.hero h1{font-size:30px;line-height:1.1}
.kv{display:flex;gap:18px;flex-wrap:wrap;color:var(--mut);margin:6px 0 14px}
.kv b{color:var(--tx)}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.panel h2{font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.mini .card{cursor:pointer}
.mini .meta h3{font-size:14px}
.tl{list-style:none;padding:0;margin:0}
.tl li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.tl li:last-child{border:0}
.back{display:inline-block;margin-bottom:10px;color:var(--mut)}

/* statistiche */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile b{display:block;font-size:32px;line-height:1;background:linear-gradient(90deg,var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.tile span{color:var(--mut);font-size:13px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(80px,38%) 1fr 34px;gap:8px;align-items:center;margin:5px 0;font-size:14px}
.bar-row .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{background:var(--bg);border-radius:6px;height:14px;overflow:hidden}
.bt i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:6px}
.bar-row b{text-align:right}
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;font-size:12px}
.cols i{display:block;width:100%;max-width:46px;background:linear-gradient(180deg,var(--b),var(--a));border-radius:6px 6px 0 0;min-height:2px}
.cols em{font-style:normal;color:var(--mut);margin-top:4px}
.fun{list-style:none;padding:0;margin:0}
.fun li{padding:7px 0;border-bottom:1px solid var(--line)}
.fun li:last-child{border:0}
.fun b{color:var(--b)}

/* modali */
.backdrop{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:18px;width:100%;max-width:520px;padding:18px;position:relative;margin:auto}
.modal.lb{max-width:880px;padding:0;overflow:hidden;display:grid;grid-template-columns:1.2fr 1fr}
.lb-img{position:relative;background:#000;min-height:320px;display:flex;align-items:center;justify-content:center}
.lb-img img{width:100%;height:100%;max-height:82vh;object-fit:contain;opacity:0;transition:opacity .3s;position:absolute;inset:0}
.lb-img img.ok{opacity:1}
.lb-img .ini{font-size:90px;font-weight:900;color:#fff8}
.lb-img{background:var(--g,#000)}
.lb-info{padding:22px 20px;display:flex;flex-direction:column;gap:6px}
.lb-info h2{font-size:26px}
.lb-info .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.x{position:absolute;top:8px;right:8px;z-index:3;background:#000a;border:0;border-radius:50%;width:32px;height:32px;cursor:pointer;color:#fff;font-size:16px}
@media(max-width:700px){.modal.lb{grid-template-columns:1fr}.lb-img{min-height:60vh}}
.f label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
.f input,.f select,.f textarea{width:100%}
.f .r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.f .prev{width:96px;aspect-ratio:3/4;border-radius:10px;border:1px dashed var(--line);object-fit:cover;background:var(--bg)}
.f .newev{border:1px solid var(--line);border-radius:12px;padding:0 12px 12px;margin-top:10px;background:var(--bg)}
.f .chk{display:flex;gap:8px;align-items:center;color:var(--tx);margin-top:12px}
.f .chk input{width:auto}
.log{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font:12.5px/1.5 ui-monospace,monospace;max-height:220px;overflow:auto;white-space:pre-wrap;color:var(--mut)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:#000e;border:1px solid var(--line);padding:9px 16px;border-radius:12px;max-width:92vw}
#toast .err{border-color:var(--bad);color:#ffb4b4}
#toast .ok{border-color:var(--ok)}
@media(max-width:600px){.top{padding:8px 10px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.grid.list{grid-template-columns:1fr}.toolbar select{max-width:none;flex:1 1 45%}}
#build{position:fixed;left:10px;bottom:10px;z-index:30;display:flex;gap:6px;align-items:center;background:#000c;border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 11px;font-size:12px;color:var(--mut)}
#build button{border:0;background:var(--card);color:var(--tx);border-radius:99px;padding:3px 10px;cursor:pointer;font-size:12px}
#build button.new{background:var(--a);color:#fff;font-weight:700}
main{padding-bottom:60px}
/* ===== skin ===== */
html{--cov:radial-gradient(circle at 30% 15%,#34343a,#0b0b0d 72%);--cov-ink:#e6e8ee;--pg:linear-gradient(160deg,#1b1b1f,#0e0e10);--ink:#ecedf2;--ink2:#9a9eab;--sline:#7b8190;--sbg:#0a0a0c;--frame:#ececf0;--fnt:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;--pk1:#e11d2e;--pk2:#3a0a10;--pkink:#fff}
html[data-skin=inferno]{--cov:linear-gradient(180deg,#240700 0%,#8a1400 62%,#ff6a00 130%);--cov-ink:#ffd9a8;--pg:linear-gradient(170deg,#1e0b05,#0f0503);--ink:#ffe2c4;--ink2:#c8805a;--sline:#ff6a1a;--sbg:#0c0402;--frame:#ffd9a8;--pk1:#ff4a1c;--pk2:#4a0800}
html[data-skin=toxic]{--cov:radial-gradient(circle at 70% 20%,#16301a,#050a06 75%);--cov-ink:#b8ff5a;--pg:linear-gradient(160deg,#0d170e,#060b07);--ink:#d9ffcf;--ink2:#7fb26a;--sline:#7dff2a;--sbg:#040704;--frame:#d4ff00;--fnt:"Courier New",monospace;--pk1:#7dff2a;--pk2:#0d2a08;--pkink:#06130a}
html[data-skin=vinile]{--cov:repeating-radial-gradient(circle at 50% 55%,#101010 0 3px,#1b1b1b 3px 6px);--cov-ink:#f0d38a;--pg:linear-gradient(160deg,#1d1810,#100d08);--ink:#f3e4b5;--ink2:#b39a5a;--sline:#c8a24a;--sbg:#0b0905;--frame:#f5e3a0;--fnt:Georgia,serif;--pk1:#e0b341;--pk2:#2a1e05;--pkink:#1a1202}
html[data-skin=synth]{--cov:linear-gradient(180deg,#120325 0%,#3a0a63 58%,#ff2bd6 135%);--cov-ink:#7df6ff;--pg:linear-gradient(160deg,#170832,#0b0319);--ink:#ffd9ff;--ink2:#b48ad0;--sline:#ff2bd6;--sbg:#0a0220;--frame:#7df6ff;--pk1:#ff2bd6;--pk2:#1b0540}
html[data-skin=black]{--cov:linear-gradient(160deg,#f4f4f4,#b9b9b9);--cov-ink:#111;--pg:linear-gradient(160deg,#f3f3f1,#d9d9d6);--ink:#111;--ink2:#555;--sline:#333;--sbg:#e4e4e0;--frame:#111;--fnt:Georgia,"Times New Roman",serif;--pk1:#f5f5f5;--pk2:#777;--pkink:#111}
html[data-skin=vintage]{--cov:linear-gradient(160deg,#7a4a26,#4a2a12);--cov-ink:#f4d58a;--pg:linear-gradient(160deg,#f4e6c6,#e6d3a6);--ink:#3a2a14;--ink2:#7a6234;--sline:#8a6b3a;--sbg:#efe0bb;--frame:#fff7e0;--fnt:Georgia,serif;--pk1:#d9541e;--pk2:#5a1f08;--pkink:#fff2d8}
html[data-skin=black] .cap .tg,html[data-skin=black] .cap b{color:#111}
html[data-skin=black] .scnt{background:#111;color:#fff}

/* ===== animazioni generali ===== */
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes grow{from{width:0}to{width:var(--w)}}
@keyframes rise{from{height:0}to{height:var(--h)}}
@keyframes popIn{0%{opacity:0;transform:scale(.8) translateY(20px)}60%{transform:scale(1.03)}100%{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
#view{animation:pageIn .35s both}
.card{animation:cardIn .5s both;animation-delay:calc(var(--i,0)*35ms)}
.backdrop{animation:fadeIn .2s both}
.modal{animation:popIn .35s cubic-bezier(.2,.9,.3,1.2) both}
#toast div{animation:toastIn .3s both}
.tile{animation:cardIn .5s both}.tile:nth-child(2){animation-delay:.05s}.tile:nth-child(3){animation-delay:.1s}.tile:nth-child(4){animation-delay:.15s}.tile:nth-child(5){animation-delay:.2s}.tile:nth-child(6){animation-delay:.25s}.tile:nth-child(7){animation-delay:.3s}
.bt i{width:var(--w);animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.cols i{height:var(--h);animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
.logo{animation:pulse 3.5s ease-in-out infinite}
.btn.pri:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn{transition:transform .15s,filter .15s,border-color .15s}
.card:hover .cnt{animation:pulse .6s}
#pkBadge{background:var(--a);color:#fff;border-radius:99px;padding:0 7px;margin-left:5px;font-size:12px;animation:pulse 1.6s infinite}
.noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.fx{position:fixed;width:7px;height:7px;border-radius:50%;z-index:90;pointer-events:none}
nav{overflow-x:auto;max-width:100%}nav a{white-space:nowrap}
.hint{color:var(--mut)}
.rnd-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0 18px}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 12px;border-radius:16px;border:2px solid var(--line);background:linear-gradient(160deg,var(--card),var(--bg2));cursor:pointer;text-align:center;transition:transform .2s,border-color .2s,box-shadow .2s}
.rbtn i{font-style:normal;font-size:42px;transition:transform .4s}
.rbtn b{font-size:17px}.rbtn span{color:var(--mut);font-size:13px}
.rbtn:hover:not(:disabled){transform:translateY(-4px);border-color:var(--a);box-shadow:0 8px 24px color-mix(in srgb,var(--a) 40%,transparent)}
.rbtn:hover:not(:disabled) i{transform:rotate(360deg) scale(1.2)}
.rbtn:disabled{opacity:.5;cursor:wait}
.reel{height:96px;display:flex;align-items:center;justify-content:center;border:2px solid var(--a);border-radius:16px;background:var(--bg2);box-shadow:inset 0 0 40px color-mix(in srgb,var(--a) 35%,transparent);overflow:hidden;padding:0 14px;text-align:center}
.reel span{font:900 clamp(22px,5vw,38px)/1.1 Impact,system-ui,sans-serif;text-transform:uppercase;letter-spacing:1px}
.reel span.tk{animation:tickIn .09s both}
@keyframes tickIn{from{transform:translateY(-70%);opacity:.2}to{transform:none;opacity:1}}
.reel.lock{animation:pulse .6s}.reel.lock span{color:var(--b);text-shadow:0 0 20px var(--a)}
.rres{animation:popIn .5s both;margin-top:4px}
.rhead small{color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-size:12px}
.rhead h2{font:400 clamp(28px,6vw,48px)/1 Impact,system-ui,sans-serif;text-transform:uppercase;letter-spacing:1px;margin:2px 0 6px;background:linear-gradient(90deg,var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.rgrid .card{animation-name:dealCard;animation-delay:calc(var(--i,0)*170ms + .2s)}
@keyframes dealCard{from{opacity:0;transform:translateY(-120px) scale(.4) rotate(-14deg)}to{opacity:1;transform:none}}
.rband{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;margin-top:10px}
.rbig{width:min(72vw,250px)}
.rbig .card{animation-name:dealCard;animation-delay:.15s}
.rside{flex:1;min-width:240px}.rside h3{font-size:22px}
.ract{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 8px}
.cap .edev{font-size:.85em;cursor:pointer;opacity:.55}.cap .edev:hover{opacity:1}

/* ===== libro ===== */
.bookwrap{display:flex;justify-content:center;padding:8px 0 4px;overflow:hidden}
.bkstage{position:relative}
.book{--pw:min(max(calc((100vh - 280px)*.75),230px),46vw,440px);--ph:calc(var(--pw)*1.3333);position:relative;display:flex;width:calc(var(--pw)*2);height:var(--ph);perspective:2600px;transition:transform .95s cubic-bezier(.5,.1,.2,1)}
.book.single{--pw:min(max(calc((100vh - 300px)*.75),230px),92vw,440px);width:var(--pw)}
.book.front{transform:translateX(calc(var(--pw)*-.5))}
.book.back{transform:translateX(calc(var(--pw)*.5))}
.book.thump{animation:thump .4s}
@keyframes thump{30%{transform:translateY(5px) scale(.992)}}
.pg{position:relative;flex:none;width:var(--pw);height:var(--ph);background:var(--pg);color:var(--ink);overflow:hidden;font-family:var(--fnt)}
.pg.L{border-radius:12px 0 0 12px;box-shadow:inset -26px 0 30px -22px #000c,inset 2px 0 0 #ffffff22,-6px 10px 28px #000a}
.pg.R{border-radius:0 12px 12px 0;box-shadow:inset 26px 0 30px -22px #000c,inset -2px 0 0 #ffffff22,6px 10px 28px #000a}
.book.single .pg{border-radius:12px;box-shadow:0 10px 28px #000a}
.pg.ghostpage{visibility:hidden;box-shadow:none}
.slots{position:absolute;inset:5.5% 6.5% 8% 6.5%;display:grid;grid-template-rows:repeat(3,1fr);gap:2.5%}
.slot{display:flex;align-items:center;gap:5%;min-height:0;min-width:0}
.slot.right{flex-direction:row-reverse}
.slot.right .cap{text-align:right;align-items:flex-end}
.sticker{position:relative;height:94%;aspect-ratio:5/6;flex:none;border:calc(var(--pw)*.014) solid var(--frame);border-radius:3px;background:var(--g);box-shadow:0 5px 12px #000b;transform:rotate(var(--rot,0deg));cursor:zoom-in;overflow:hidden;transition:transform .2s,box-shadow .2s}
.sticker:hover{transform:rotate(0) scale(1.07);z-index:3;box-shadow:0 10px 22px #000c}
.sticker .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--pw)*.11);font-weight:900;color:#fff9}
.sticker img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.sticker img.ok{opacity:1}
.sticker::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff66 50%,transparent 65%);transform:translateX(-130%);transition:transform .8s}
.sticker:hover::after{transform:translateX(130%)}
.snum{position:absolute;top:3%;left:5%;font:700 calc(var(--pw)*.027)/1.5 system-ui;background:#000b;color:#fff;border-radius:4px;padding:0 4px}
.scnt{position:absolute;top:3%;right:5%;font:800 calc(var(--pw)*.03)/1.5 system-ui;background:var(--b);color:#111;border-radius:99px;padding:0 6px}

<script>
'use strict';
/* ============ build ============ */
const BUILD=9,BUILD_DATE='2026-11-10';

const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'}):'—';
const evDate=e=>e.endDate&&e.endDate>e.date?`${fmt(e.date)} → ${fmt(e.endDate)}`:fmt(e.date);

/* ============ stato & persistenza ============ */

let CFG=Object.assign({owner:'olivieridomenicopodcast',repo:'Album-concerti',branch:'ccr-d6c8e450-is4c8a',token:'',lastCommit:'',dirty:false},jload('ac_cfg',{}));

const SKINS={
  metal:{n:'Nero Metal',a:'#e11d2e',b:'#c0c7d1',c:'#9aa4b2'},
  inferno:{n:'Inferno',a:'#ff4a1c',b:'#ffb300',c:'#ff8a5c'},
  toxic:{n:'Toxic',a:'#7dff2a',b:'#d4ff00',c:'#35e0c6'},
  vinile:{n:'Vinile',a:'#e0b341',b:'#f5e3a0',c:'#c8a24a'},
  synth:{n:'Neon Synthwave',a:'#ff2bd6',b:'#27e6ff',c:'#a76bff'},
  black:{n:'Black Metal',a:'#e8e8e8',b:'#9aa0a6',c:'#6b7280'},
  vintage:{n:'Rock anni 70',a:'#e0642a',b:'#e8b04a',c:'#9bb04a'}
};

  const s=SKINS[PREF.skin],r=document.documentElement;
  r.style.setProperty('--a',s.a);r.style.setProperty('--b',s.b);r.style.setProperty('--c',s.c);

let AC=null;
function actx(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch{return null}}
function noise(dur,f0,f1,vol,type='bandpass'){
  const c=actx();if(!c)return;const n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=c.createBufferSource();s.buffer=buf;const f=c.createBiquadFilter();f.type=type;
  f.frequency.setValueAtTime(f0,c.currentTime);f.frequency.exponentialRampToValueAtTime(f1,c.currentTime+dur);
  const g=c.createGain();g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);

  const c=actx();if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();

  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur);

  flip:()=>noise(.3,2600,500,.22),

  peel:()=>noise(.5,7000,1500,.3,'highpass'),

const sfx=k=>{if(PREF.sound&&PREF.anim)try{SFX[k]()}catch{}};
function burstFX(x,y,n=14,big=false){

    const e=document.createElement('i');e.className='fx';e.style.left=x+'px';e.style.top=y+'px';e.style.background=cols[i%3];
    if(big){e.style.width='9px';e.style.height='14px';e.style.borderRadius='2px'}
    document.body.appendChild(e);
    const a=Math.random()*Math.PI*2,d=(big?260:70)*(.4+Math.random()),dy=big?(Math.random()*-200):0;
    e.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+dy+(big?300:0)}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:big?1600:700,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>e.remove();
  }
}

const idb=(()=>{let db;
  const open=()=>db?Promise.resolve(db):new Promise((res,rej)=>{const r=indexedDB.open('album-concerti',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)});
  const tx=(mode,fn)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction('photos',mode);const rq=fn(t.objectStore('photos'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)}));
  return{get:id=>tx('readonly',s=>s.get(id)),put:(id,b)=>tx('readwrite',s=>s.put(b,id)),del:id=>tx('readwrite',s=>s.delete(id)),keys:()=>tx('readonly',s=>s.getAllKeys())}})();
const urls=new Map();
async function photoURL(id){if(urls.has(id))return urls.get(id);const b=await idb.get(id).catch(()=>null);if(!b)return null;const u=URL.createObjectURL(b);urls.set(id,u);return u}
function hydrate(root=document){$$('img[data-photo]',root).forEach(async img=>{const id=img.dataset.photo;if(urls.has(id)){img.src=urls.get(id);img.classList.add('ok');return}const u=await photoURL(id);if(u){img.onload=()=>img.classList.add('ok');img.src=u}})}
async function resizeImage(file,max=1100){
  let src,w,h;
  try{src=await createImageBitmap(file,{imageOrientation:'from-image'});w=src.width;h=src.height}
  catch{src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Formato immagine non supportato'));i.src=URL.createObjectURL(file)});w=src.naturalWidth;h=src.naturalHeight}
  const k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(res,'image/jpeg',.82));
}

/* ============ filtri condivisi (album sfogliabile + collezione) ============ */
function applyFilters(arr,sortKey){
  const q=norm(F.q);
  let r=arr.filter(x=>{
    if(F.year&&yearOf(x.ev)!==F.year)return false;
    if(F.city&&x.ev.city!==F.city)return false;
    if(F.event&&x.ev.id!==F.event)return false;
    if(F.festival&&x.ev.festival!==F.festival)return false;
    if(F.tour&&x.ev.name!==F.tour)return false;
    if(F.band&&x.key!==F.band)return false;
    if(F.comp&&!(x.ev.companions||[]).includes(F.comp))return false;
    if(q&&!norm([x.st.band,x.ev.name,x.ev.festival,x.ev.city,x.ev.venue,(x.ev.companions||[]).join(' ')].join(' ')).includes(q))return false;
    return true});
  const byBand=(a,b)=>a.st.band.localeCompare(b.st.band,'it');
  const byDate=(a,b)=>(a.ev.date||'').localeCompare(b.ev.date||'')||evTitle(a.ev).localeCompare(evTitle(b.ev),'it')||byBand(a,b);
  const S={'date-desc':(a,b)=>byDate(b,a),'date-asc':byDate,'az':byBand,'za':(a,b)=>byBand(b,a),'seen':(a,b)=>b.seen-a.seen||byBand(a,b)};
  return r.sort(S[sortKey]||S['date-asc']);
}

/* ============ vista: album sfogliabile ============ */
const B={p:0,flipping:false,all:[],list:[]};
const mq=window.matchMedia('(max-width:820px)');
const isSingle=()=>mq.matches;
const SKIN_ICON={metal:'🤘',inferno:'🔥',toxic:'☣️',vinile:'💿',synth:'🌆',black:'💀',vintage:'🎸'};
const curS=()=>Math.ceil(B.p/2);
const spreadP=s=>s===0?0:2*s-1;
function bookData(){
  const list=applyFilters(items(),F.bsort||'date-asc');
  let n=Math.max(2,Math.ceil(list.length/3));if(n%2)n++;
  const all=[{type:'cover'}];
  for(let i=0;i<n;i++)all.push({type:'page',idx:i+1,items:list.slice(i*3,i*3+3),base:i*3});
  all.push({type:'back'});
  return{list,all};
}
function slotHTML(it,num,align){
  if(!it)return `<div class="slot ${align}"><div class="sticker empty"><span>#${pad(num)}</span></div></div>`;
  const {st,ev}=it;const rot=((hue(st.id)%50)-25)/10;
  return `<div class="slot ${align}" data-sid="${st.id}">
    <div class="sticker" data-open="${st.id}" style="--rot:${rot}deg;--g:${grad(st.band)}">
      <div class="ini">${esc(initials(st.band))}</div>${st.photo?`<img data-photo="${esc(st.photo)}" alt="${esc(st.band)}">`:''}
      <span class="snum">#${pad(num)}</span>${it.seen?`<span class="scnt">${it.seen}×</span>`:''}${it.future?'<span class="sfut">PROSSIMAMENTE</span>':''}
    </div>
    <div class="cap"><b>${esc(st.band)}</b><span>📅 ${esc(evDate(ev))}</span>${place(ev)?`<span>📍 ${esc(place(ev))}</span>`:''}<a class="tg" href="#/event/${esc(ev.id)}" data-fev="${esc(ev.id)}" title="Mostra solo le band di questa serata">🏷 ${esc(evTitle(ev))}</a><a class="edev" data-editev="${esc(ev.id)}" title="Modifica concerto">✏️ modifica</a></div>
  </div>`;
}
function pageHTML(pg,side){
  if(!pg)return `<div class="pg ${side} ghostpage"></div>`;
  const nI=B.list.length,nE=new Set(B.list.map(x=>x.ev.id)).size,ico=SKIN_ICON[PREF.skin]||'🤘';
  if(pg.type==='cover')return `<div class="pg R cover" data-cover><div class="cv"><div class="cv-top">★ ★ ★</div><h2>I MIEI<br>CONCERTI</h2><div class="cv-ico">${ico}</div><p>${nI} ${plural(nI,'figurina','figurine')} · ${nE} ${plural(nE,'concerto','concerti')}</p><em class="cv-hint">tocca per aprire</em></div></div>`;
  if(pg.type==='back')return `<div class="pg L cover back"><div class="cv"><h2>FINE?</h2><div class="cv-ico">${ico}</div><p>Il prossimo concerto<br>lo aggiungi dopo averci fatto un salto!</p></div></div>`;
  const left=pg.idx%2===1,al=left?['left','right','left']:['right','left','right'];
  return `<div class="pg ${left?'L':'R'}"><div class="slots">${[0,1,2].map(j=>slotHTML(pg.items[j],pg.base+j+1,al[j])).join('')}</div><div class="pnum">— ${pg.idx} —</div></div>`;
}
function renderBookView(){
  $('#view').innerHTML=`${filterBar('book')}<div class="summary" id="summary"></div>
  <div class="bookwrap"><div id="bk" class="bkstage"></div></div>
  <div class="bknav"><button class="btn" id="bPrev">◀ Indietro</button><select id="bJump"></select><button class="btn" id="bNext">Avanti ▶</button></div>`;
  bindFilterBar('book',()=>{B.p=0;renderBook()},renderBookView);
  $('#bPrev').onclick=()=>flip(-1);$('#bNext').onclick=()=>flip(1);
  $('#bJump').onchange=e=>{const v=+e.target.value;e.target.blur();goPage(v)};
  const bk=$('#bk');let x0=null;
  bk.addEventListener('pointerdown',e=>{x0=e.clientX});
  bk.addEventListener('pointerup',e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>70)flip(dx<0?1:-1)});
  renderBook();
}
function renderBook(){
  const bk=$('#bk');if(!bk)return;
  const {list,all}=bookData();B.list=list;B.all=all;
  let html,state='open';
  if(isSingle()){
    B.p=Math.max(0,Math.min(B.p,all.length-1));
    html=`<div class="book single">${pageHTML(all[B.p],B.p%2?'L':'R')}</div>`;
  }else{
    const maxS=all.length/2;let s=Math.min(curS(),maxS);B.p=spreadP(s);
    state=s===0?'front':s===maxS?'back':'open';
    html=`<div class="book ${state}">${s>0?pageHTML(all[2*s-1],'L'):pageHTML(null,'L')}${s<maxS?pageHTML(all[2*s],'R'):pageHTML(null,'R')}</div>`;
  }
  bk.innerHTML=html;hydrate(bk);bindBook();updateBookNav();
  const nE=new Set(list.map(x=>x.ev.id)).size;
  const sm=$('#summary');if(sm)sm.textContent=items().length?`${list.length} ${plural(list.length,'figurina','figurine')} · ${nE} ${plural(nE,'concerto/festival','concerti/festival')}`:'';
}
function updateBookNav(){
  const all=B.all,single=isSingle(),j=$('#bJump');if(!j)return;
  const opts=[];
  if(single)all.forEach((p,i)=>opts.push([i,p.type==='cover'?'Copertina':p.type==='back'?'Retro':`Pagina ${p.idx}`]));
  else for(let s=0;s<=all.length/2;s++){const l=all[2*s-1],r=all[2*s];opts.push([spreadP(s),s===0?'Copertina':!r?'Retro':`Pagine ${l.idx}–${r.idx}`])}
  j.innerHTML=opts.map(([v,t])=>`<option value="${v}">${t}</option>`).join('');j.value=B.p;
  $('#bPrev').disabled=B.p<=0;
  $('#bNext').disabled=single?B.p>=all.length-1:curS()>=all.length/2;
}
function bindBook(){
  const bk=$('#bk');
  $$('[data-open]',bk).forEach(e=>e.onclick=()=>lightbox(e.dataset.open));
  $$('[data-editev]',bk).forEach(e=>e.onclick=()=>eventForm(e.dataset.editev));
  $$('[data-fev]',bk).forEach(a=>a.onclick=e=>{e.preventDefault();F.event=a.dataset.fev;jsave('ac_filters',F);B.p=0;renderBookView()});
  $$('.pg',bk).forEach(p=>p.addEventListener('click',e=>{
    if(e.target.closest('.sticker,a'))return;
    if(p.classList.contains('cover')&&!p.classList.contains('back')){flip(1);return}
    if(isSingle())return;
    if(p.classList.contains('L'))flip(-1);else if(p.classList.contains('R'))flip(1);
  }));
}
function goPage(v){ // v = valore B.p di destinazione
  if(isSingle())flipSingle(v);else flipSpread(Math.ceil(v/2));
}
function flip(dir){
  if(B.flipping||!B.all.length)return;
  if(isSingle()){const np=B.p+dir;if(np>=0&&np<B.all.length)flipSingle(np)}
  else{const ns=curS()+dir;if(ns>=0&&ns<=B.all.length/2)flipSpread(ns)}
}
async function flipSpread(ns){
  const s=curS();if(ns===s||B.flipping)return;
  const all=B.all,maxS=all.length/2,dir=ns>s?1:-1,bk=$('#bk'),book=$('.book',bk);
  if(!book)return;
  if(!PREF.anim){B.p=spreadP(ns);renderBook();return}
  B.flipping=true;sfx('flip');
  const front=dir>0?all[2*s]:all[2*s-1],back=dir>0?all[2*ns-1]:all[2*ns];
  if(dir>0)book.children[1].outerHTML=pageHTML(ns<maxS?all[2*ns]:null,'R');
  else book.children[0].outerHTML=pageHTML(ns>0?all[2*ns-1]:null,'L');
  const leaf=document.createElement('div');leaf.className='leaf '+(dir>0?'next':'prev');
  leaf.innerHTML=`<div class="face">${pageHTML(front,dir>0?'R':'L')}</div><div class="face bk">${pageHTML(back,dir>0?'L':'R')}</div>`;
  book.appendChild(leaf);hydrate(leaf);
  book.className='book '+(ns===0?'front':ns===maxS?'back':'open');
  requestAnimationFrame(()=>requestAnimationFrame(()=>leaf.classList.add('go')));
  await sleep(1000);
  B.p=spreadP(ns);B.flipping=false;renderBook();
}
async function flipSingle(np){
  if(np===B.p||B.flipping)return;
  const all=B.all,dir=np>B.p?1:-1,book=$('#bk .book');if(!book)return;
  if(!PREF.anim){B.p=np;renderBook();return}
  B.flipping=true;sfx('flip');
  const mk=pg=>`<div class="leaf1 ${dir>0?'':'in'}">${pageHTML(pg,'R')}</div>`;
  book.innerHTML=dir>0?pageHTML(all[np],'R')+mk(all[B.p]):pageHTML(all[B.p],'R')+mk(all[np]);
  const leaf=$('.leaf1',book);hydrate(book);
  requestAnimationFrame(()=>requestAnimationFrame(()=>leaf.classList.add('go')));
  await sleep(850);
  B.p=np;B.flipping=false;renderBook();
}
async function bookShow(pageIdx){ // pagina "content" (indice in all) da mostrare
  renderBook();
  if(isSingle()){if(pageIdx!==B.p)await flipSingle(pageIdx)}
  else{const ns=Math.ceil(pageIdx/2);if(ns!==curS())await flipSpread(ns)}
}

    <div class="tile"><b style="font-size:20px">${esc(fmt(asc[asc.length-1].ev.date))}</b><span>ultima volta</span></div>`:''}
  </div>

  <div class="panel"><h2>Cronologia concerti</h2><ul class="tl">${its.map(x=>`<li><span><a href="#/event/${x.ev.id}"><b>${esc(evTitle(x.ev))}</b></a> ${x.future?'<span class="chip">prossimamente</span>':''}</span><span style="color:var(--mut)">${esc(evDate(x.ev))}${place(x.ev)?' · '+esc(place(x.ev)):''}</span></li>`).join('')}</ul></div>`;

/* ============ vista: statistiche ============ */
const countBy=(arr,fn)=>{const m=new Map();arr.forEach(x=>{const k=fn(x);if(k)m.set(k,(m.get(k)||0)+1)});return m};
const topN=(m,n=8)=>[...m].sort((a,b)=>b[1]-a[1]||String(a[0]).localeCompare(String(b[0]),'it')).slice(0,n);
function bars(rows,link){
  if(!rows.length)return '<span style="color:var(--mut)">Nessun dato</span>';
  const mx=Math.max(...rows.map(r=>r.v));
  return rows.map(r=>`<div class="bar-row"><span class="bl" title="${esc(r.l)}">${r.href?`<a href="${r.href}">${esc(r.l)}</a>`:esc(r.l)}</span><div class="bt"><i style="--w:${Math.max(3,r.v/mx*100)}%"></i></div><b>${r.v}</b></div>`).join('');
}
function renderStats(){
  const all=items(),t=todayISO();
  const LE=liveEvents(),pastEv=LE.filter(e=>e.date),futEv=[];
  const past=all.filter(x=>!x.future);
  if(!LE.length){$('#view').innerHTML='<div class="empty"><h2>Nessuna statistica, per ora 📊</h2><p>Aggiungi qualche concerto all\'album.</p></div>';return}
  const names=new Map();past.forEach(x=>names.set(x.key,x.st.band));
  const perBand=countBy(past,x=>x.key);
  const perYear=countBy(pastEv,e=>yearOf(e));
  const years=[...perYear.keys()].sort();
  const firstSeenYear=new Map();[...past].sort((a,b)=>a.ev.date.localeCompare(b.ev.date)).forEach(x=>{if(!firstSeenYear.has(x.key))firstSeenYear.set(x.key,yearOf(x.ev))});
  const newPerYear=countBy([...firstSeenYear.values()],y=>y);
  const perCity=countBy(pastEv,e=>e.city),perVenue=countBy(pastEv,e=>e.venue);
  const compMap=new Map();pastEv.forEach(e=>(e.companions||[]).forEach(c=>{const k=norm(c);const o=compMap.get(k)||{n:c,c:0};o.c++;compMap.set(k,o)}));
  const perMonth=countBy(pastEv,e=>['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'][+e.date.slice(5,7)-1]);
  const days=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
  const perDow=countBy(pastEv,e=>days[new Date(e.date+'T12:00:00').getDay()]);
  const lineupSize=new Map(pastEv.map(e=>[e.id,past.filter(x=>x.ev.id===e.id).length]));
  const sizes=[...lineupSize.values()];
  const biggest=[...lineupSize].sort((a,b)=>b[1]-a[1])[0];
  const festivals=sizes.filter(n=>n>=4).length;
  const once=[...perBand.values()].filter(v=>v===1).length,loyal=[...perBand.values()].filter(v=>v>=3).length;
  const citiesPerBand=new Map();past.forEach(x=>{if(!x.ev.city)return;const s=citiesPerBand.get(x.key)||new Set();s.add(x.ev.city);citiesPerBand.set(x.key,s)});
  const roamer=[...citiesPerBand].sort((a,b)=>b[1].size-a[1].size)[0];
  const dates=uniq(pastEv.map(e=>e.date)).sort();
  let gap={d:0};for(let i=1;i<dates.length;i++){const d=Math.round((new Date(dates[i])-new Date(dates[i-1]))/864e5);if(d>gap.d)gap={d,a:dates[i-1],b:dates[i]}}
  const next=[...futEv].sort((a,b)=>a.date.localeCompare(b.date))[0];
  const dd=d=>Math.ceil((new Date(d+'T12:00:00')-new Date(t+'T12:00:00'))/864e5);
  const last=dates[dates.length-1];
  const bestYear=topN(perYear,1)[0];
  const avg=sizes.length?(sizes.reduce((a,b)=>a+b,0)/sizes.length).toFixed(1).replace('.',','):'0';
  const li=(h)=>`<li>${h}</li>`;
  const tile=(v,l)=>`<div class="tile"><b data-n="${v}">${v}</b><span>${l}</span></div>`;
  $('#view').innerHTML=`<h1 style="margin-bottom:14px">📊 Statistiche</h1>
  <div class="tiles">
    ${tile(pastEv.length,'concerti / festival visti')}
    ${tile(perBand.size,'band uniche viste')}
    ${tile(past.length,'esibizioni viste in totale')}
    ${tile(perCity.size,'città')}
    ${tile(perVenue.size,'locali diversi')}
    ${tile(compMap.size,'compagni di concerto')}
  </div>
  <div class="two">
    <div class="panel"><h2>Band più viste</h2>${bars(topN(perBand,10).map(([k,v])=>({l:names.get(k),v,href:'#/band/'+encodeURIComponent(k)})))}</div>
    <div class="panel"><h2>Concerti per anno</h2><div class="cols">${(()=>{const mx=Math.max(1,...perYear.values());return years.map(y=>`<div><b>${perYear.get(y)}</b><i style="--h:${perYear.get(y)/mx*100*.78}%"></i><em>${y}</em></div>`).join('')})()}</div></div>
    <div class="panel"><h2>Band nuove scoperte dal vivo, per anno</h2><div class="cols">${(()=>{const ys=[...newPerYear.keys()].sort();const mx=Math.max(1,...newPerYear.values());return ys.map(y=>`<div><b>${newPerYear.get(y)}</b><i style="--h:${newPerYear.get(y)/mx*100*.78}%"></i><em>${y}</em></div>`).join('')})()}</div></div>
    <div class="panel"><h2>Città più frequentate</h2>${bars(topN(perCity).map(([l,v])=>({l,v})))}</div>
    <div class="panel"><h2>Locali più frequentati</h2>${bars(topN(perVenue).map(([l,v])=>({l,v})))}</div>
    <div class="panel"><h2>Compagni di avventura</h2>${bars([...compMap.values()].sort((a,b)=>b.c-a.c).slice(0,8).map(o=>({l:o.n,v:o.c})))}</div>
    <div class="panel"><h2>Mese preferito per i live</h2>${bars(topN(perMonth,12).map(([l,v])=>({l,v})))}</div>
    <div class="panel"><h2>Giorno della settimana</h2>${bars(topN(perDow,7).map(([l,v])=>({l,v})))}</div>
  </div>
  <div class="panel"><h2>Curiosità</h2><ul class="fun">
    ${last?li(`⏱️ Ultimo concerto: <b>${esc(fmt(last))}</b> — sono passati <b>${-dd(last)}</b> giorni`):''}
    ${dates.length?li(`🥇 Primo concerto registrato: <b>${esc(fmt(dates[0]))}</b>`):''}
    ${bestYear?li(`🏆 Anno record: <b>${bestYear[0]}</b> con <b>${bestYear[1]}</b> concerti`):''}
    ${biggest&&biggest[1]?li(`🎪 Serata con più band: <b>${esc(evTitle(DB.events.find(e=>e.id===biggest[0])))}</b> (<b>${biggest[1]}</b> band)`):''}
    ${li(`🎤 Media di <b>${avg}</b> band a concerto · <b>${festivals}</b> ${plural(festivals,'serata','serate')} da 4+ band (stile festival)`)}
    ${perBand.size?li(`🔁 Band viste una sola volta: <b>${once}</b> · fedelissime (3+ volte): <b>${loyal}</b>`):''}
    ${roamer&&roamer[1].size>1?li(`🧳 Band inseguita in più città: <b>${esc(names.get(roamer[0]))}</b> in <b>${roamer[1].size}</b> città`):''}
    ${gap.d?li(`🌵 Digiuno più lungo: <b>${gap.d}</b> giorni (da ${esc(fmt(gap.a))} a ${esc(fmt(gap.b))})`):''}
  </ul></div>`;
  countUp($('#view'));
}
function countUp(root){
  if(!PREF.anim)return;
  $$('b[data-n]',root).forEach(b=>{const n=+b.dataset.n;if(!n)return;const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/900);b.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
}

/* ============ sync GitHub ============ */
let syncLog=[],busy=false;
const slog=m=>{syncLog.push(new Date().toLocaleTimeString('it-IT')+'  '+m);const l=$('#log');if(l){l.textContent=syncLog.join('\n');l.scrollTop=1e9}};
const cfgReady=()=>CFG.token&&CFG.owner&&CFG.repo&&CFG.branch;
const DATA_PATH='dati/data.json',PHOTO_DIR='dati/photos/';
async function gh(path,o={}){
  const r=await fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}${path}`,{method:o.method||'GET',cache:'no-store',
    headers:{Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(o.body?{'Content-Type':'application/json'}:{})},
    body:o.body?JSON.stringify(o.body):undefined});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch{}const e=new Error(`GitHub ${r.status}: ${m||r.statusText}`);e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
const branchRef=()=>CFG.branch.split('/').map(encodeURIComponent).join('/');
async function remoteState(){
  let head;
  try{head=(await gh(`/git/ref/heads/${branchRef()}`)).object.sha}
  catch(e){if(e.status===404||e.status===409)throw new Error(`Branch "${CFG.branch}" non trovato (o repository vuoto). Controlla le impostazioni.`);throw e}
  const commit=await gh(`/git/commits/${head}`);
  const tree=await gh(`/git/trees/${commit.tree.sha}?recursive=1`);
  return{head,treeSha:commit.tree.sha,entries:new Map(tree.tree.filter(t=>t.type==='blob').map(t=>[t.path,t.sha]))};
}
const b64bytes=b=>Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0));
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
async function pool(list,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,list.length)},async()=>{while(i<list.length)await fn(list[i++])}))}
async function withBusy(fn){
  if(busy)return;if(!cfgReady()){toast('Configura prima il token GitHub','err');location.hash='#/sync';return}
  busy=true;$$('#bPull,#bPush,.syncbtn').forEach(b=>b.disabled=true);
  try{await fn()}catch(e){slog('❌ '+e.message);toast(e.message,'err')}
  finally{busy=false;$$('#bPull,#bPush,.syncbtn').forEach(b=>b.disabled=false);refreshDirty()}
}
const doTest=()=>withBusy(async()=>{
  const r=await gh('');slog(`✅ Repo ${r.full_name} raggiungibile — permessi push: ${r.permissions?.push?'sì':'NO'}`);
  if(r.permissions&&!r.permissions.push)toast('Il token non ha permessi di scrittura','err');else toast('Connessione OK','ok')});
const doPull=()=>withBusy(async()=>{
  if(CFG.dirty&&!confirm('Hai modifiche locali non inviate: il pull le sovrascriverà. Continuare?'))return;
  slog('⬇ Pull: leggo il repository…');
  const rs=await remoteState();
  const sha=rs.entries.get(DATA_PATH);
  if(!sha)throw new Error(`Nessun file ${DATA_PATH} nel repository: fai prima un Push.`);
  const blob=await gh(`/git/blobs/${sha}`);
  const remote=JSON.parse(new TextDecoder().decode(b64bytes(blob.content)));
  if(!Array.isArray(remote.events)||!Array.isArray(remote.stickers))throw new Error('data.json non valido');
  const need=uniq(remote.stickers.map(s=>s.photo).filter(Boolean));
  const have=new Set(await idb.keys());
  const missing=need.filter(id=>!have.has(id));
  slog(`Trovati ${remote.events.length} concerti, ${remote.stickers.length} figurine, ${missing.length} foto da scaricare`);
  let done=0;
  await pool(missing,4,async id=>{
    const s=rs.entries.get(PHOTO_DIR+id+'.jpg');if(!s){slog('⚠ foto mancante sul repo: '+id);return}
    const b=await gh(`/git/blobs/${s}`);await idb.put(id,new Blob([b64bytes(b.content)],{type:'image/jpeg'}));
    slog(`  foto ${++done}/${missing.length}`)});
  for(const id of have)if(!need.includes(id)){await idb.del(id);urls.delete(id)}
  DB=remote;jsave('ac_data',DB);CFG.lastCommit=rs.head;CFG.dirty=false;saveCfg();
  slog('✅ Pull completato');toast('Pull completato','ok');route();
});
const doPush=()=>withBusy(async()=>{
  slog('⬆ Push: leggo il repository…');
  const rs=await remoteState();
  if(rs.entries.has(DATA_PATH)&&rs.head!==CFG.lastCommit&&!confirm('Il repository è cambiato dall\'ultimo sync (altro dispositivo?). Il push sovrascriverà i dati remoti con quelli locali. Continuare?\n\n(Annulla e fai un Pull se vuoi prima scaricare le modifiche.)'))return;
  const tree=[];
  const need=uniq(DB.stickers.map(s=>s.photo).filter(Boolean));
  const up=need.filter(id=>!rs.entries.has(PHOTO_DIR+id+'.jpg'));
  slog(`Foto da caricare: ${up.length}`);let n=0;
  await pool(up,3,async id=>{
    const b=await idb.get(id);if(!b){slog('⚠ foto locale mancante: '+id);return}
    const r=await gh('/git/blobs',{method:'POST',body:{content:await blobToB64(b),encoding:'base64'}});
    tree.push({path:PHOTO_DIR+id+'.jpg',mode:'100644',type:'blob',sha:r.sha});slog(`  foto ${++n}/${up.length}`)});
  for(const p of rs.entries.keys())if(p.startsWith(PHOTO_DIR)&&!need.includes(p.slice(PHOTO_DIR.length).replace(/\.jpg$/,''))){tree.push({path:p,mode:'100644',type:'blob',sha:null})}
  const json=JSON.stringify(DB,null,1);
  const jb=await gh('/git/blobs',{method:'POST',body:{content:json,encoding:'utf-8'}});
  if(rs.entries.get(DATA_PATH)!==jb.sha)tree.push({path:DATA_PATH,mode:'100644',type:'blob',sha:jb.sha});
  if(!tree.length){CFG.lastCommit=rs.head;CFG.dirty=false;saveCfg();slog('✅ Già tutto aggiornato');toast('Già aggiornato','ok');return}
  const nt=await gh('/git/trees',{method:'POST',body:{base_tree:rs.treeSha,tree}});
  const c=await gh('/git/commits',{method:'POST',body:{message:`Album concerti: aggiornamento ${new Date().toLocaleString('it-IT')}`,tree:nt.sha,parents:[rs.head]}});
  await gh(`/git/refs/heads/${branchRef()}`,{method:'PATCH',body:{sha:c.sha}});
  CFG.lastCommit=c.sha;CFG.dirty=false;saveCfg();
  slog('✅ Push completato (commit '+c.sha.slice(0,7)+')');toast('Push completato','ok');
});

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function buildRandomPacks(mode,x,n){
  const all=items(),packs=[];
  if(mode==='sticker'){
    const pool=shuffle(all);
    for(let i=0;i<n&&pool.length;i++){const take=[];while(take.length<x&&pool.length)take.push(pool.pop());packs.push(take)}
  }else{
    const m=new Map();
    all.forEach(it=>{const k=mode==='event'?it.ev.id:(it.ev.festival?'f:'+norm(it.ev.festival):null);if(!k)return;if(!m.has(k))m.set(k,[]);m.get(k).push(it)});
    const units=shuffle([...m.values()]);
    for(let i=0;i<n&&units.length;i++){const take=[];while(take.length<x&&units.length)take.push(...units.pop());
      take.sort((a,b)=>(a.ev.date||'').localeCompare(b.ev.date||'')||a.st.band.localeCompare(b.st.band,'it'));packs.push(take)}
  }
  return packs.map(sts=>({id:'rp'+uid(),sts,opened:false}));
}

    tray.insertAdjacentHTML('beforeend',`<span class="trt" style="--g:${grad(st.band)}"><b>${esc(initials(st.band))}</b>${st.photo?`<img data-photo="${esc(st.photo)}" alt="">`:''}</span>`);hydrate(tray);sfx('slap');
  }
  tray.remove();$('.pk-skip',ov).remove();msg.textContent='';
  stage.classList.add('sum');
  stage.innerHTML=`<div class="pk-count">Pacchetto aperto! 🎉</div><div class="grid pk-sum">${pk.sts.map(cardHTML).join('')}</div><button class="btn pri" id="pkClose">Chiudi</button>`;
  $$('.card',stage).forEach((c,i)=>c.style.setProperty('--i',Math.min(i,12)));hydrate(stage);
  if(!skip){sfx('chime');confetti()}
  $$('[data-open]',stage).forEach(e=>e.onclick=()=>{close();lightbox(e.dataset.open)});
  $$('[data-tag]',stage).forEach(e=>e.onclick=ev=>{ev.stopPropagation();close();go('#/event/'+e.dataset.tag)});
  function close(){ov.remove();pk.opened=true;RND.busy=false;renderRandomPacks()}
  $('#pkClose',stage).onclick=close;
}

/* ============ router ============ */
let CUR='album';
function route(top){
  const [,p,arg]=(location.hash||'#/album').split('/');
  const page=p||'album';CUR=page;
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.n===(page==='event'||page==='band'?'collezione':page)));
  const a=arg?decodeURIComponent(arg):'';
  const v=$('#view');v.style.animation='none';void v.offsetHeight;v.style.animation='';
  if(page==='stats')renderStats();else if(page==='sync')renderSync();else if(page==='event')renderEvent(a);else if(page==='band')renderBand(a);
  else if(page==='collezione')renderCollection();else if(page==='random')renderRandom();else if(page==='packs')renderPacks();else renderBookView();
  updatePackBadge();
  if(top)window.scrollTo(0,0);
}
/* ============ liveEvents / pacchetti ============ */
function liveEvents(){
  const pend=new Set(DB.stickers.filter(s=>s.pending).map(s=>s.eventId)),real=new Set(DB.stickers.filter(s=>!s.pending).map(s=>s.eventId));
  return DB.events.filter(e=>!pend.has(e.id)||real.has(e.id));
}
function packsList(){
  const m=new Map();
  DB.stickers.filter(s=>s.pending&&s.pack).forEach(s=>{if(!m.has(s.pack))m.set(s.pack,[]);m.get(s.pack).push(s)});
  return [...m];
}
const unassigned=()=>DB.stickers.filter(s=>s.pending&&!s.pack);
function assignPacks(sts,N){
  const sorted=[...sts].sort((a,b)=>(evOf(a).date||'').localeCompare(evOf(b).date||''));
  const base=Math.floor(sorted.length/N),extra=sorted.length%N;let k=0;
  for(let i=0;i<N;i++){const id='pk'+uid()+i,n=base+(i<extra?1:0);for(let j=0;j<n;j++)sorted[k++].pack=id}
}
const evOf=st=>DB.events.find(e=>e.id===st.eventId)||{name:'?',date:''};
function mkItem(st){
  const ev=evOf(st),t=todayISO(),key=norm(st.band),others=DB.stickers.filter(s=>!s.pending&&norm(s.band)===key);
  const seen=others.filter(s=>{const e=evOf(s);return e.date&&e.date<=t}).length;
  return{st,ev,key,future:false,seen,isNew:!others.length};
}
function packHTML(id,n,i){
  return `<div class="packw" data-pack="${id}" style="--i:${i}"><div class="pack3"><div class="pk-top"></div><div class="pk-main"><span class="pk-star">✦</span><div class="pk-ico">${SKIN_ICON[PREF.skin]||'🤘'}</div><b>${esc(SKINS[PREF.skin].n.toUpperCase())}</b><small>PACK CONCERTI</small><em>${n} ${plural(n,'figurina','figurine')}</em></div><div class="pk-btm"></div><span class="pk-shine"></span></div><button class="btn sm pri">Apri</button></div>`;
}
function renderPacks(){
  const packs=packsList(),un=unassigned();
  $('#view').innerHTML=`<h1 style="margin-bottom:6px">📦 Pacchetti</h1>
  <p style="color:var(--mut);margin:0 0 16px">Le figurine inserite in blocco arrivano qui dentro a dei pacchetti: aprili, stacca la pellicola e incollale nell'album.</p>
  ${un.length?`<div class="panel f"><h2>${un.length} figurine non ancora in pacchetto</h2><div style="display:flex;gap:8px;align-items:end;flex-wrap:wrap"><div><label>Quanti pacchetti?</label><input type="number" id="uN" min="1" max="${un.length}" value="${Math.max(1,Math.min(un.length,Math.ceil(un.length/5)))}" style="width:110px"></div><button class="btn pri" id="uMake">Crea pacchetti</button></div></div>`:''}
  ${packs.length?`<div style="margin-bottom:14px"><button class="btn pri" id="openAll">🎁 Apri tutti in sequenza</button></div><div class="packs">${packs.map(([id,s],i)=>packHTML(id,s.length,i)).join('')}</div>`
   :(un.length?'':`<div class="empty"><h2>Nessun pacchetto da aprire 🎁</h2><p>Usa <b>📦 Inserimento rapido</b> per aggiungere tante figurine in blocco.</p><button class="btn pri" id="eBulk">📦 Inserimento rapido</button></div>`)}`;
  $$('.packw').forEach(p=>p.onclick=()=>openPack(p.dataset.pack));
  if($('#uMake'))$('#uMake').onclick=()=>{assignPacks(un,Math.max(1,Math.min(un.length,+$('#uN').value||1)));touch();renderPacks();updatePackBadge()};
  if($('#openAll'))$('#openAll').onclick=async()=>{for(const [id] of packsList()){const ok=await openPack(id);if(ok===false)break}};
  if($('#eBulk'))$('#eBulk').onclick=()=>bulkForm();
}
function updatePackBadge(){const n=DB.stickers.filter(s=>s.pending).length;const b=$('#pkBadge');if(b){b.textContent=n?n:'';b.hidden=!n}}

async function openPack(packId){
  const order=DB.stickers.filter(s=>s.pending&&s.pack===packId).sort((a,b)=>(evOf(a).date||'').localeCompare(evOf(b).date||''));
  if(!order.length)return true;
  closeAll();
  Object.assign(F,{q:'',year:'',city:'',event:'',festival:'',tour:'',band:'',comp:''});jsave('ac_filters',F);
  if(CUR!=='album'){history.replaceState(null,'','#/album');route(true)}
  const pasteNow=sts=>{sts.forEach(s=>{s.pending=false;delete s.pack});touch()};
  if(!PREF.anim){pasteNow(order);toast(`${order.length} figurine incollate`,'ok');route();return true}
  const ov=document.createElement('div');ov.className='pk';
  ov.innerHTML=`<button class="btn sm pk-skip">Salta animazione ⏭</button><div class="pk-stage"></div><div class="pk-msg"></div>`;
  document.body.appendChild(ov);
  const stage=$('.pk-stage',ov),msg=$('.pk-msg',ov);
  let skip=false,abort;const aborted=new Promise(r=>abort=r);
  const waitClick=el=>Promise.race([new Promise(r=>el.addEventListener('click',r,{once:true})),aborted]);
  $('.pk-skip',ov).onclick=()=>{skip=true;abort()};
  const total=order.length;
  /* 1. il pacchetto */
  stage.innerHTML=`<div class="pack3 float"><div class="pk-top"></div><div class="pk-main"><span class="pk-star">✦</span><div class="pk-ico">${SKIN_ICON[PREF.skin]||'🤘'}</div><b>${esc(SKINS[PREF.skin].n.toUpperCase())}</b><small>PACK CONCERTI</small><em>${total} ${plural(total,'figurina','figurine')}</em></div><div class="pk-btm"></div><span class="pk-shine"></span></div><div class="pk-burst"></div>`;
  const pk=$('.pack3',stage);msg.textContent='Tocca il pacchetto per aprirlo!';
  await waitClick(pk);
  if(!skip){
    msg.textContent='';pk.classList.remove('float');pk.classList.add('shake');sfx('pop');await sleep(680);
    if(!skip){sfx('rip');pk.classList.add('tear');$('.pk-burst',stage).classList.add('go');await sleep(650)}
    if(!skip){pk.classList.add('gone');sfx('chime');await sleep(500)}
  }
  /* 2. una figurina alla volta */
  for(let i=0;i<total&&!skip;i++){
    const st=order[i],it=mkItem(st);
    ov.classList.remove('see');
    const badge=it.isNew?'✨ NUOVA BAND!':it.future?'🎟️ PROSSIMAMENTE':`🔁 Già vista ${it.seen} ${plural(it.seen,'volta','volte')}`;
    stage.innerHTML=`<div class="pk-count">${i+1} / ${total}</div><div class="pk-badge ${it.isNew?'new':''}">${badge}</div>
      <div class="bigst" style="--g:${grad(st.band)}"><div class="bigin"><div class="ini">${esc(initials(st.band))}</div>${st.photo?`<img data-photo="${esc(st.photo)}" alt="">`:''}</div><div class="film"><i class="fshine"></i></div></div>
      <div class="bigcap"><b>${esc(st.band)}</b><span>📅 ${esc(evDate(it.ev))}${place(it.ev)?' · 📍 '+esc(place(it.ev)):''}</span><span class="tag">🏷 ${esc(evTitle(it.ev))}</span></div>`;
    hydrate(stage);sfx('pop');await sleep(600);
    if(skip)break;
    const big=$('.bigst',stage);msg.textContent='Tocca la figurina per staccare la pellicola';
    await waitClick(big);if(skip)break;
    msg.textContent='';big.classList.add('peel');sfx('peel');await sleep(950);
    $('.film',big)?.remove();
    /* 3. incolla nell'album */
    pasteNow([st]);
    const {list}=bookData(),idx=list.findIndex(x=>x.st.id===st.id);
    ov.classList.add('see');$('.bigcap',stage).style.opacity=0;$('.pk-badge',stage).style.opacity=0;$('.pk-count',stage).style.opacity=0;
    await sleep(300);
    $('#bk')?.scrollIntoView({block:'center',behavior:'instant'});
    await bookShow(1+Math.floor(Math.max(idx,0)/3));
    const slotEl=$(`#bk [data-sid="${st.id}"]`),tgt=slotEl&&$('.sticker',slotEl);
    if(!tgt){await sleep(300);continue}
    slotEl.classList.add('ghost');
    const tr=tgt.getBoundingClientRect(),br=big.getBoundingClientRect();
    const k=tr.width/br.width,dx=tr.left+tr.width/2-(br.left+br.width/2),dy=tr.top+tr.height/2-(br.top+br.height/2);
    const rot=parseFloat(getComputedStyle(tgt).getPropertyValue('--rot'))||0;
    const a=big.animate([{transform:'translate(0,0) scale(1) rotate(0deg)'},
      {transform:`translate(${dx*.55}px,${dy*.55-70}px) scale(${(1+k)/2*1.12}) rotate(${rot*-3}deg)`,offset:.55},
      {transform:`translate(${dx}px,${dy}px) scale(${k}) rotate(${rot}deg)`}],{duration:800,easing:'cubic-bezier(.45,0,.25,1)',fill:'forwards'});
    sfx('rip');await a.finished.catch(()=>{});
    big.remove();slotEl.classList.remove('ghost');slotEl.classList.add('slap');
    sfx('slap');$('#bk .book')?.classList.add('thump');
    burstFX(tr.left+tr.width/2,tr.top+tr.height/2,16);
    await sleep(750);slotEl.classList.remove('slap');$('#bk .book')?.classList.remove('thump');
  }
  if(skip){pasteNow(DB.stickers.filter(s=>s.pending&&s.pack===packId));ov.remove();renderBook();updatePackBadge();toast('Figurine incollate','ok');if(CUR==='packs')renderPacks();return false}
  ov.remove();sfx('chime');confetti();
  toast(`${total} ${plural(total,'figurina incollata','figurine incollate')} nell'album! 🤘`,'ok');
  updatePackBadge();if(CUR==='packs')renderPacks();
  return true;
}

/* ============ inserimento rapido (blocco) ============ */
function parseDate(s){
  if(!s)return '';let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return `${m[1]}-${p2(m[2])}-${p2(m[3])}`;
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);if(m){let y=m[3];if(y.length===2)y='20'+y;return `${y}-${p2(m[2])}-${p2(m[1])}`}return '';
}
function bulkForm(prefill=[]){
  const el=modal(`<button class="x" data-close>✕</button><form class="f" autocomplete="off"><h2>📦 Inserimento rapido</h2>${datalists()}
    
    <p style="color:var(--mut);margin:4px 0 8px">Aggiungi tante figurine in blocco. Ogni nuova riga copia concerto, data e luogo della precedente: cambi solo la band.</p>
    <div class="bacts"><button type="button" class="btn sm" id="bRow">＋ Riga</button><label class="btn sm">🖼 Aggiungi foto<input type="file" accept="image/*" multiple hidden id="bFiles"></label><button type="button" class="btn sm" id="bPaste">📋 Incolla elenco</button></div>
    <div id="brows"></div>
    <div class="bpack"><div><label>Quanti pacchetti?</label><input type="number" id="bN" min="1" value="1" style="width:100px"></div><span id="bPer" style="color:var(--mut)"></span>
      <label class="chk"><input type="checkbox" id="bDirect"> Incolla subito, senza pacchetti</label></div>
    <div class="acts"><button type="button" class="btn" data-close>Annulla</button><button class="btn pri">Crea figurine</button></div></form>`,'wide');
  const rows=$('#brows',el);let userN=false;
  const vals=r=>({band:$('.b-band',r).value.trim(),name:$('.b-name',r).value.trim(),festival:$('.b-fest',r).value.trim(),date:$('.b-date',r).value,venue:$('.b-venue',r).value.trim(),city:$('.b-city',r).value.trim()});
  const upd=()=>{const n=[...rows.children].filter(r=>$('.b-band',r).value.trim()).length||1;
    if(!userN)$('#bN',el).value=Math.max(1,Math.ceil(n/5));
    const N=Math.max(1,+$('#bN',el).value||1);$('#bPer',el).textContent=`≈ ${Math.ceil(n/N)} figurine per pacchetto (${n} totali)`};
  function addRow(v={}){
    const prev=rows.lastElementChild,pv=prev?vals(prev):{};
    const d=Object.assign({band:'',name:pv.name||'',festival:pv.festival||'',date:pv.date||'',venue:pv.venue||'',city:pv.city||''},v);
    const r=document.createElement('div');r.className='brow';
    r.innerHTML=`<label class="bph" title="Foto"><input type="file" accept="image/*" hidden><img alt=""><span>📷</span></label>
      <input class="b-band" list="dl-band" placeholder="Band *" value="${esc(d.band)}">
      <input class="b-name" list="dl-evname" placeholder="Concerto / tour" value="${esc(d.name)}">
      <input class="b-fest" list="dl-fest" placeholder="Festival" value="${esc(d.festival)}">
      <input class="b-date" type="date" value="${esc(d.date)}">
      <input class="b-venue" list="dl-venue" placeholder="Locale" value="${esc(d.venue)}">
      <input class="b-city" list="dl-city" placeholder="Città" value="${esc(d.city)}">
      <button type="button" class="btn sm dan b-rm" title="Rimuovi">✕</button>`;
    const setBlob=b=>{r._blob=b;$('img',r).src=URL.createObjectURL(b);r.classList.add('hasph')};
    if(v.blob)setBlob(v.blob);
    $('.bph input',r).onchange=async e=>{const f=e.target.files[0];if(f)try{setBlob(await resizeImage(f))}catch(err){toast(err.message,'err')}};
    $('.b-rm',r).onclick=()=>{r.remove();upd()};
    const auto=e=>{const nm=norm(e.target.value);if(!nm||$('.b-date',r).value)return;
      const m=[...DB.events].filter(x=>norm(x.name)===nm||norm(x.festival)===nm).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
      if(m){$('.b-date',r).value=m.date||'';if(e.target.classList.contains('b-name')&&!$('.b-fest',r).value)$('.b-fest',r).value=m.festival||'';if(!$('.b-venue',r).value)$('.b-venue',r).value=m.venue||'';if(!$('.b-city',r).value)$('.b-city',r).value=m.city||''}};
    $('.b-name',r).onchange=auto;$('.b-fest',r).onchange=auto;
    r.addEventListener('input',e=>{r.classList.remove('bad');if(e.target.classList.contains('b-band'))upd()});
    rows.appendChild(r);upd();return r;
  }
  prefill.length?prefill.forEach(addRow):addRow();
  $('#bRow',el).onclick=()=>{const r=addRow();$('.b-band',r).focus();r.scrollIntoView({block:'nearest'})};
  $('#bN',el).oninput=()=>{userN=true;upd()};
  $('#bFiles',el).onchange=async e=>{
    const fs=[...e.target.files];
    for(const f of fs){try{const b=await resizeImage(f);
      const empty=[...rows.children].find(r=>!r._blob&&!$('.b-band',r).value.trim());
      if(empty){empty._blob=b;$('img',empty).src=URL.createObjectURL(b);empty.classList.add('hasph')}else addRow({blob:b})}catch(err){toast(err.message,'err')}}
    e.target.value='';
  };
  $('#bPaste',el).onclick=()=>{
    const m2=modal(`<button class="x" data-close>✕</button><form class="f"><h2>📋 Incolla elenco</h2>
      <p style="color:var(--mut)">Una figurina per riga: <code>Band; Concerto/Tour; Data; Locale; Città; Festival</code><br>Data come 2025-06-20 oppure 20/06/2025. Locale, città e festival sono facoltativi.</p>
      <textarea rows="9" id="pTxt" placeholder="Gojira; Hellfest 2025; 20/06/2025; Clisson; Clisson&#10;Sepultura; Hellfest 2025; 20/06/2025"></textarea>
      <div class="acts"><button type="button" class="btn" data-close>Annulla</button><button class="btn pri">Importa</button></div></form>`);
    $('form',m2).onsubmit=ev=>{ev.preventDefault();let n=0;
      $('#pTxt',m2).value.split(/\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{const p=l.split(/\t|;|\|/).map(x=>x.trim());
        if(!p[0])return;const last=rows.lastElementChild;
        if(last&&!$('.b-band',last).value.trim()&&!last._blob)last.remove();
        addRow({band:p[0],name:p[1]||'',date:parseDate(p[2]),venue:p[3]||'',city:p[4]||'',festival:p[5]||''});n++});
      m2.close();toast(`${n} righe importate`,'ok')};
  };
  $('form',el).onsubmit=async e=>{
    e.preventDefault();
    const rs=[...rows.children].map(r=>({r,v:vals(r),blob:r._blob})).filter(x=>x.v.band||x.v.name||x.v.festival||x.blob);
    if(!rs.length){toast('Nessuna riga da salvare','err');return}
    const bad=rs.filter(x=>!x.v.band||(!x.v.name&&!x.v.festival)||!x.v.date);
    if(bad.length){bad.forEach(x=>x.r.classList.add('bad'));bad[0].r.scrollIntoView({block:'center'});toast(`${bad.length} righe incomplete: servono band, data e concerto o festival`,'err');return}
    const direct=$('#bDirect',el).checked,created=[];
    for(const x of rs){
      let ev=DB.events.find(e=>norm(e.name)===norm(x.v.name)&&norm(e.festival)===norm(x.v.festival)&&e.date===x.v.date);
      if(!ev){ev={id:uid(),name:x.v.name,festival:x.v.festival,date:x.v.date,endDate:'',venue:x.v.venue,city:x.v.city,companions:[],notes:''};DB.events.push(ev)}
      else{if(!ev.venue&&x.v.venue)ev.venue=x.v.venue;if(!ev.city&&x.v.city)ev.city=x.v.city}
      let photo=null;if(x.blob){photo=uid();await idb.put(photo,x.blob)}
      const st={id:uid(),band:x.v.band,eventId:ev.id,photo};if(!direct)st.pending=true;
      created.push(st);DB.stickers.push(st);
    }
    if(!direct)assignPacks(created,Math.max(1,Math.min(created.length,+$('#bN',el).value||1)));
    touch();el.close();
    if(direct){toast(`${created.length} figurine aggiunte`,'ok');if(CUR==='album')renderBook();else go('#/album')}
    else{toast(`${created.length} figurine pronte nei pacchetti! 📦`,'ok');go('#/packs')}
    updatePackBadge();
  };
}
const go=h=>{if(location.hash===h)route(true);else location.hash=h};

window.addEventListener("hashchange",()=>{closeAll();route(true)});
$('#bAdd').onclick=()=>stickerForm();
$('#bBulk').onclick=()=>bulkForm();
applySkin();
mq.addEventListener('change',()=>{if(CUR==='album')renderBook()});
document.addEventListener('keydown',e=>{if(CUR!=='album'||$('.backdrop')||$('.pk')||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight')flip(1);if(e.key==='ArrowLeft')flip(-1)});
$('#bPull').onclick=doPull;$('#bPush').onclick=doPush;
$('#bLabel').textContent=`build ${BUILD} · ${BUILD_DATE}`;
let newerBuild=false;
$('#bCheck').onclick=async()=>{
  const btn=$('#bCheck');
  if(newerBuild){location.href=location.pathname+'?v='+Date.now()+location.hash;return}
  btn.disabled=true;btn.textContent='Controllo…';
  try{
    const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const m=(await r.text()).match(/const BUILD=(\d+)/);

    const remote=+m[1];

    else{btn.textContent='↻ Aggiornamenti';toast('Sei già all\'ultima build ('+BUILD+')','ok')}
  }catch(e){btn.textContent='↻ Aggiornamenti';toast('Controllo non riuscito: '+e.message+' (funziona solo se l\'app è pubblicata online)','err')}
  btn.disabled=false;
};
refreshDirty();route();
if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});
